name: Deploy Symfony & Next.js

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ PHP + Composer
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, intl, pdo_mysql
          tools: composer
          
       # Creation of env file 
      - name: Create prod env
        run: |
          cd Server
          echo "APP_ENV=prod" > .env.prod.local
          echo "APP_DEBUG=0" >> .env.prod.local
          echo "APP_SECRET=${{ secrets.APP_SECRET }}" >> .env.prod.local
          echo "DATABASE_URL=mysql://${{ secrets.DATABASE_USER }}:${{ secrets.DB_PASS }}@127.0.0.1:3306/${{ secrets.DATABASE_USER }}?serverVersion=8.0&charset=utf8mb4" >> .env.prod.local
          echo "CORS_ALLOW_ORIGIN='^https://radiata\-explorer\.com$'" >> .env.prod.local
          
      # 3️⃣ Installer dépendances Symfony (PROD)
      - name: Install backend dependencies (Symfony)
        run: |
          cd Server
          APP_ENV=prod composer install --no-dev --optimize-autoloader

      # 4️⃣ Compiler l’environnement PROD Symfony
      - name: Build Symfony prod env
        run: |
          cd Server
          composer dump-env prod

      # 5️⃣ Setup Node.js (NE PAS TOUCHER)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 6️⃣ Build assets Symfony (Encore)
      - name: Build Symfony assets
        run: |
          cd Server
          npm install
          npm run build

      # 7️⃣ Déploiement backend Symfony (FTP)
      - name: Deploy backend (Symfony)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./Server/
          server-dir: /Server/
          exclude: |
            **/.git/**
            **/.github/**
            **/node_modules/**
            **/.env
            **/.env.local
            **/var/cache/**
            **/var/log/**

      # ======================
      # FRONTEND (INCHANGÉ)
      # ======================

      - name: Create .env for Next.js
        run: |
          cd Client
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> .env
          echo "NEXT_PUBLIC_APP_NAME=MyApp" >> .env
          echo "NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}" >> .env

      - name: Build frontend (Next.js)
        run: |
          cd Client
          npm install --legacy-peer-deps
          npm run build

      - name: Deploy frontend (Next.js)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./Client/out/
          server-dir: /
          exclude: |
            **/Server/**
